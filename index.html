<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI专业测试 · 专业选择画像测试</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #fff;
      --ink: #2f3a52;
      --muted: #72809a;
      --line: #e3e9f3;
      --primary: #2f8fef;
      --primary-soft: #eef5ff;
      --shadow: 0 8px 24px rgba(32, 46, 79, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    .shell { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }

    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 12px rgba(32, 46, 79, 0.04);
      padding: 14px 16px;
      margin: 0 -16px 0;
    }
    .brand-lockup {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .brand-logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 14px rgba(47, 143, 239, 0.25);
      flex-shrink: 0;
      display: block;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      text-align: left;
      line-height: 1.2;
      min-height: 52px;
    }
    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
      background: linear-gradient(120deg, #2f8fef 0%, #1ab8c4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .brand-powered {
      margin-top: 4px;
      font-size: 0.78rem;
      color: #8b97ad;
      font-weight: 500;
      line-height: 1.2;
    }
    .brand-powered a {
      color: #5a7ab5;
      text-decoration: none;
      font-weight: 600;
    }
    .brand-powered a:hover { color: var(--primary); text-decoration: underline; }

    .hero {
      background: linear-gradient(180deg, #fff 0%, #f8fafe 100%);
      border-bottom: 1px solid var(--line);
      padding: 28px 16px 28px;
      text-align: center;
      margin: 0 -16px 24px;
    }
    .hero h1 { font-size: clamp(1.35rem, 3.5vw, 1.75rem); margin-bottom: 8px; color: #384058; font-weight: 700; }
    .hero .subtitle { color: var(--muted); max-width: 560px; margin: 0 auto 12px; font-size: 0.95rem; }
    .hero .meta { color: #9aa6bc; font-size: 0.85rem; margin-bottom: 16px; }
    .btn {
      border: 0; border-radius: 999px; padding: 11px 20px;
      font-weight: 700; font-size: 0.95rem; cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    .btn-primary {
      background: linear-gradient(120deg, #2f8fef 0%, #1ab8c4 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(47, 143, 239, 0.28);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(47, 143, 239, 0.35);
    }
    .btn-secondary {
      background: #fff;
      color: #5a6880;
      border: 2px solid #d8e2f0;
    }
    .btn-secondary:hover { background: #f8fafd; }
    .btn-outline {
      background: #fff;
      color: #1d6fd8;
      border: 2px solid #6eb5ff;
      box-shadow: 0 2px 8px rgba(47, 143, 239, 0.1);
    }
    .btn-outline:hover {
      background: linear-gradient(120deg, #f0f7ff 0%, #eefaf8 100%);
      transform: translateY(-1px);
    }
    .btn-share {
      background: linear-gradient(120deg, #e8f4ff 0%, #e6faf5 100%);
      color: #1d6fd8;
      border: 2px solid #6eb5ff;
      box-shadow: 0 2px 8px rgba(47, 143, 239, 0.15);
    }
    .btn-share:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(47, 143, 239, 0.2);
    }
    .share-copied-tip {
      flex-basis: 100%;
      text-align: center;
      font-size: 0.88rem;
      color: #2ea67d;
      font-weight: 700;
      min-height: 1.2em;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .share-copied-tip.show { opacity: 1; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .result-actions {
      display: flex;
      align-items: stretch;
      gap: 12px;
      margin-top: 24px;
    }
    .result-actions .btn {
      min-width: 0;
      padding: 13px 14px;
      font-size: 0.88rem;
      line-height: 1.25;
    }
    .result-actions-share {
      flex-direction: column;
      gap: 10px;
    }
    .result-actions-share .result-actions-row { width: 100%; }
    .result-actions-share .result-actions-row .btn { flex: 1; }
    .result-actions-share .btn-share-copy { width: 100%; flex: none; }
    .result-actions-full {
      flex-direction: column;
      gap: 10px;
    }
    .result-actions-row {
      display: flex;
      flex-direction: row;
      gap: 12px;
      width: 100%;
    }
    .result-actions-row .btn { flex: 1; }
    .major-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 4px;
    }
    .major-pill {
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 8px;
      background: #f0f4fa;
      color: #4a5872;
      font-weight: 600;
    }
    .result-subline {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 6px;
    }
    .share-banner {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin: 8px 0 16px;
    }
    .share-back-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      color: #4a5872;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(32, 46, 79, 0.08);
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .share-back-btn:hover {
      background: #fff;
      color: var(--primary);
      border-color: #bcd4f5;
    }
    body.share-view .hero,
    body.share-view #quizSection { display: none !important; }
    body.quiz-view .hero,
    body.result-view .hero { display: none !important; }
    body.quiz-view #quizSection { padding-top: 24px; }
    .hidden { display: none !important; }

    .progress-wrap { margin-bottom: 16px; }
    .progress-meta {
      display: flex; justify-content: space-between;
      font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 8px;
    }
    .progress-track {
      height: 8px; background: #e7edf7; border-radius: 999px; overflow: hidden;
    }
    .progress-track span {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, #5eb0ff, var(--primary));
      transition: width 0.25s ease;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .module-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .q-text {
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      font-weight: 700;
      color: #36435f;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .q-hint { font-size: 0.88rem; color: var(--muted); margin-bottom: 12px; }

    .options { display: grid; gap: 10px; }
    .opt {
      width: 100%;
      text-align: left;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 12px 14px;
      font-size: 0.95rem;
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .opt:hover { border-color: #b8c9e8; background: #f8fbff; }
    .opt.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
      font-weight: 600;
    }
    .opt.multi.selected::after { content: " ✓"; color: var(--primary); }

    .slider-wrap { padding: 8px 4px; }
    .slider-labels {
      display: flex; justify-content: space-between;
      font-size: 0.82rem; color: var(--muted); margin-bottom: 8px;
    }
    .slider-value {
      text-align: center; font-size: 1.5rem; font-weight: 800;
      color: var(--primary); margin-bottom: 10px;
    }
    input[type="range"] {
      width: 100%; accent-color: var(--primary);
    }

    .scale07-wrap { margin-top: 8px; }
    .scale07-labels {
      display: flex; justify-content: space-between;
      font-size: 0.88rem; font-weight: 700; margin-bottom: 12px;
    }
    .scale07-labels .low { color: #8f5daf; }
    .scale07-labels .high { color: #2ea67d; }
    .scale07-btns {
      display: flex; justify-content: space-between; align-items: center;
      gap: 6px; flex-wrap: nowrap;
    }
    .scale07-btn {
      --sz: 32px;
      width: var(--sz); height: var(--sz);
      border-radius: 50%;
      border: 2px solid #c5cfe0;
      background: #fff;
      font-size: 0.82rem; font-weight: 700;
      color: #5a6880;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .scale07-btn[data-v="0"], .scale07-btn[data-v="7"] { --sz: 42px; }
    .scale07-btn[data-v="1"], .scale07-btn[data-v="6"] { --sz: 38px; }
    .scale07-btn[data-v="2"], .scale07-btn[data-v="5"] { --sz: 34px; }
    .scale07-btn[data-v="0"], .scale07-btn[data-v="1"], .scale07-btn[data-v="2"] { border-color: #c9a8d8; color: #7a4f92; }
    .scale07-btn[data-v="3"], .scale07-btn[data-v="4"] { border-color: #c5cfe0; color: #5a6880; }
    .scale07-btn[data-v="5"], .scale07-btn[data-v="6"], .scale07-btn[data-v="7"] { border-color: #7ec9b0; color: #2d8a66; }
    .scale07-btn:hover:not(.selected) {
      background: #f8fafd;
      transform: scale(1.04);
    }
    .scale07-btn.selected {
      border-width: 3px;
      font-weight: 800;
      transform: scale(1.06);
    }
    .scale07-btn.selected.low-side {
      background: #f7f0fa;
      border-color: #8f5daf;
      color: #7a4f92;
      box-shadow: 0 0 0 3px rgba(143, 93, 175, 0.16);
    }
    .scale07-btn.selected.mid-side {
      background: #f4f6f9;
      border-color: #6b7a94;
      color: #4a5872;
      box-shadow: 0 0 0 3px rgba(107, 122, 148, 0.14);
    }
    .scale07-btn.selected.high-side {
      background: #eef8f3;
      border-color: #2ea67d;
      color: #2d8a66;
      box-shadow: 0 0 0 3px rgba(46, 166, 125, 0.16);
    }

    .pager { display: flex; justify-content: space-between; gap: 12px; }
    .pager .btn { flex: 1; max-width: 200px; }

    .result { margin-top: 8px; }
    .result h2 { font-size: 1.4rem; margin-bottom: 8px; }
    .result .profile-name {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 800;
      color: var(--primary);
      margin: 8px 0 12px;
    }
    .keywords { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .kw {
      font-size: 0.82rem; padding: 5px 10px;
      border-radius: 999px; background: var(--primary-soft);
      color: #3d6a9e; font-weight: 600;
    }
    .section { margin: 18px 0; }
    .section h3 { font-size: 1rem; margin-bottom: 8px; color: #4a5872; }
    .section p, .section li { color: #5a6880; font-size: 0.92rem; }
    .section ul { margin-left: 18px; display: grid; gap: 6px; }
    .section li span {
      display: block;
      color: #7d8aa4;
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .caution { color: #b45309; }
    .consultant-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #f8fafe;
      margin-bottom: 10px;
    }
    .consultant-card strong { display: block; margin-bottom: 4px; }
    .consultant-card span { font-size: 0.88rem; color: var(--muted); }
    .cta-guide {
      margin-top: 14px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #cfe0f8;
      background: linear-gradient(135deg, #f0f7ff 0%, #eefaf8 100%);
    }
    .cta-guide h4 {
      font-size: 0.95rem;
      color: #36435f;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .cta-guide p {
      font-size: 0.9rem;
      color: #5a6880;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .cta-guide .btn-cta {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(120deg, #2f8fef 0%, #1ab8c4 100%);
      color: #fff;
      padding: 11px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.92rem;
      box-shadow: 0 4px 14px rgba(47, 143, 239, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .cta-guide .btn-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(47, 143, 239, 0.35);
    }
    .cta-price {
      font-size: 0.88rem;
      color: #5a6880;
      margin-bottom: 12px;
    }
    .cta-price s { color: #9aa6bc; margin-right: 6px; }
    .cta-price strong { color: #e85d4c; font-size: 1rem; }
    .disclaimer {
      font-size: 0.82rem; color: #8b97ad;
      border-top: 1px solid var(--line);
      padding-top: 14px; margin-top: 16px;
    }
    @media (max-width: 520px) {
      .brand-lockup { gap: 11px; }
      .brand-logo { width: 44px; height: 44px; }
      .brand-title { font-size: 1.05rem; }
      .pager { flex-direction: column; }
      .pager .btn { max-width: none; width: 100%; }
      .result-actions-share { flex-direction: column; }
      .result-actions-share .result-actions-row .btn { font-size: 0.82rem; padding: 12px 10px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand-lockup">
      <img src="./assets/logo.png" alt="AI专业测试" class="brand-logo" width="52" height="52">
      <div class="brand-text">
        <div class="brand-title">AI专业测试</div>
        <div class="brand-powered">powered by <a href="https://ai.voce.chat" target="_blank" rel="noopener noreferrer">ai.voce.chat</a></div>
      </div>
    </div>
  </header>

  <button type="button" id="shareBackBtn" class="share-back-btn hidden" aria-label="返回完整结果">← 返回</button>

  <section class="hero">
    <div class="shell">
      <h1 id="heroTitle">专业选择画像测试</h1>
      <p class="subtitle" id="heroSubtitle">加载中…</p>
      <p class="meta" id="heroMeta"></p>
      <button id="startBtn" class="btn btn-primary" disabled>加载题库…</button>
    </div>
  </section>

  <div class="shell">
    <p id="shareBanner" class="share-banner hidden">好友分享的专业选择画像结果</p>
    <section id="quizSection" class="hidden">
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="progressText">第 1 题</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-track"><span id="progressBar"></span></div>
      </div>
      <div id="questionCard" class="card"></div>
      <div class="pager">
        <button id="prevBtn" class="btn btn-secondary">上一题</button>
        <button id="nextBtn" class="btn btn-primary">下一题</button>
      </div>
    </section>

    <section id="resultSection" class="result hidden"></section>
  </div>

  <script>
    let config = null;
    let currentIndex = 0;
    const answers = {};

    const heroTitle = document.getElementById("heroTitle");
    const heroSubtitle = document.getElementById("heroSubtitle");
    const heroMeta = document.getElementById("heroMeta");
    const startBtn = document.getElementById("startBtn");
    const quizSection = document.getElementById("quizSection");
    const questionCard = document.getElementById("questionCard");
    const progressText = document.getElementById("progressText");
    const progressPct = document.getElementById("progressPct");
    const progressBar = document.getElementById("progressBar");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resultSection = document.getElementById("resultSection");

    const PROFILE_SLUGS = {
      stable_employment: "se",
      high_income_sprint: "hi",
      public_sector_planner: "ps",
      technical_deep_dive: "td",
      research_explorer: "re",
      creative_expression: "ce",
      people_influence: "pi",
      interdisciplinary_transformer: "it"
    };
    const SLUG_TO_PROFILE = Object.fromEntries(
      Object.entries(PROFILE_SLUGS).map(([id, slug]) => [slug, id])
    );
    const FULL_RESULT_SESSION_KEY = "majorTestFullResult";

    function resolveProfileId(value) {
      if (!value) return "";
      return SLUG_TO_PROFILE[value] || value;
    }

    function profileSlug(id) {
      return PROFILE_SLUGS[id] || id;
    }

    function parseShareData(params) {
      const slug = params.get("r") || params.get("p");
      if (slug) {
        const p = resolveProfileId(slug);
        const sRaw = params.get("s") || "";
        const s = resolveProfileId(sRaw);
        return { p, s, c: s ? "低" : "中" };
      }
      const legacy = params.get("result");
      if (legacy) return fromBase64Url(legacy);
      return null;
    }

    function dimensionKeys() {
      return Object.keys(config.score_dimensions || {});
    }

    function emptyScores() {
      const s = {};
      dimensionKeys().forEach((k) => { s[k] = 0; });
      return s;
    }

    function evalFormula(formula, scores) {
      let expr = formula;
      dimensionKeys().forEach((k) => {
        expr = expr.replace(new RegExp("\\b" + k + "\\b", "g"), String(scores[k] ?? 0));
      });
      try {
        return Function('"use strict"; return (' + expr + ")")();
      } catch (e) {
        return 0;
      }
    }

    function applyOptionScores(target, optionScores, multiplier) {
      if (!optionScores) return;
      const m = multiplier == null ? 1 : multiplier;
      Object.entries(optionScores).forEach(([dim, val]) => {
        if (target[dim] !== undefined) target[dim] += (Number(val) || 0) * m;
      });
    }

    function getSelectedOptions(q) {
      const ans = answers[q.id];
      if (!q.options) return [];
      if (q.type === "multi_choice") {
        return (ans || []).map((oid) => q.options.find((o) => o.id === oid)).filter(Boolean);
      }
      if (q.type === "single_choice" && ans) {
        const opt = q.options.find((o) => o.id === ans);
        return opt ? [opt] : [];
      }
      return [];
    }

    function accumulateScores() {
      const scores = emptyScores();
      config.questions.forEach((q) => {
        const ans = answers[q.id];
        if (ans === undefined || ans === null) return;

        if (q.type === "single_choice") {
          const opt = q.options.find((o) => o.id === ans);
          if (opt) applyOptionScores(scores, opt.scores);
        } else if (q.type === "multi_choice") {
          const selected = getSelectedOptions(q);
          if (!selected.length) return;
          const bucket = emptyScores();
          selected.forEach((opt) => applyOptionScores(bucket, opt.scores));
          const factor = 1 / selected.length;
          dimensionKeys().forEach((dim) => {
            scores[dim] += bucket[dim] * factor;
          });
        } else if ((q.type === "slider" || q.type === "scale_0_7") && q.score_formula) {
          const v = Number(ans);
          Object.entries(q.score_formula).forEach(([dim, formula]) => {
            const f = String(formula).replace(/value/g, String(v));
            if (scores[dim] !== undefined) scores[dim] += evalFormula(f, scores);
          });
        }
      });
      return scores;
    }

    function rankProfiles(scores) {
      return (config.profile_rules || [])
        .map((rule) => ({
          rule,
          score: evalFormula(rule.match_formula, scores)
        }))
        .sort((a, b) => b.score - a.score);
    }

    function confidenceLabel(top, second) {
      if (!second || second.score <= 0) return "高";
      const gap = (top.score - second.score) / Math.max(top.score, 0.01);
      if (gap >= 0.2) return "高";
      if (gap >= 0.1) return "中";
      return "低";
    }

    function isAnswered(q) {
      const ans = answers[q.id];
      if (q.type === "multi_choice") return Array.isArray(ans) && ans.length > 0;
      if (q.type === "slider" || q.type === "scale_0_7") {
        return typeof ans === "number" && !Number.isNaN(ans);
      }
      return ans !== undefined && ans !== null && ans !== "";
    }

    function defaultSliderValue(q) {
      return Math.round((q.min + q.max) / 2);
    }

    function initAnswerForQuestion(q) {
      if (q.type === "multi_choice") answers[q.id] = [];
      else if (q.type === "slider") answers[q.id] = defaultSliderValue(q);
      else answers[q.id] = null;
    }

    function updateNextButtonState() {
      const q = config.questions[currentIndex];
      nextBtn.disabled = !!(q.required && !isAnswered(q));
    }

    function renderHero() {
      const meta = config.test_meta;
      document.title = meta.title || document.title;
      heroTitle.textContent = meta.title || "专业选择画像测试";
      heroSubtitle.textContent = meta.subtitle || "";
      heroMeta.textContent = "约 " + (meta.estimated_time_minutes || 3) + " 分钟 · " + config.questions.length + " 题";
    }

    function renderQuestion() {
      const q = config.questions[currentIndex];
      const total = config.questions.length;
      const pct = Math.round(((currentIndex + 1) / total) * 100);
      progressText.textContent = "第 " + (currentIndex + 1) + " / " + total + " 题";
      progressPct.textContent = pct + "%";
      progressBar.style.width = pct + "%";

      questionCard.innerHTML = "";
      if (q.module) {
        const tag = document.createElement("div");
        tag.className = "module-tag";
        tag.textContent = q.module;
        questionCard.appendChild(tag);
      }
      const title = document.createElement("div");
      title.className = "q-text";
      title.textContent = q.question;
      questionCard.appendChild(title);

      if (q.type === "multi_choice") {
        const hint = document.createElement("div");
        hint.className = "q-hint";
        const max = q.max_select || 99;
        hint.textContent = max < 99 ? "可多选，最多选择 " + max + " 项" : "可多选";
        questionCard.appendChild(hint);
      }

      const optionsWrap = document.createElement("div");
      optionsWrap.className = "options";

      if (q.type === "scale_0_7") {
        const wrap = document.createElement("div");
        wrap.className = "scale07-wrap";
        const labels = document.createElement("div");
        labels.className = "scale07-labels";
        labels.innerHTML = "<span class=\"low\">" + (q.min_label || "0") + "</span><span class=\"high\">" + (q.max_label || "7") + "</span>";
        const btns = document.createElement("div");
        btns.className = "scale07-btns";
        const selected = answers[q.id];
        for (let v = 0; v <= 7; v += 1) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "scale07-btn";
          btn.dataset.v = String(v);
          btn.textContent = String(v);
          if (selected === v) {
            btn.classList.add("selected");
            if (v <= 2) btn.classList.add("low-side");
            else if (v >= 5) btn.classList.add("high-side");
            else btn.classList.add("mid-side");
          }
          btn.addEventListener("click", () => {
            answers[q.id] = v;
            renderQuestion();
          });
          btns.appendChild(btn);
        }
        wrap.appendChild(labels);
        wrap.appendChild(btns);
        questionCard.appendChild(wrap);
      } else if (q.type === "slider") {
        const wrap = document.createElement("div");
        wrap.className = "slider-wrap";
        if (answers[q.id] == null || Number.isNaN(answers[q.id])) {
          answers[q.id] = defaultSliderValue(q);
        }
        const val = answers[q.id];

        const valEl = document.createElement("div");
        valEl.className = "slider-value";
        valEl.textContent = val;

        const labels = document.createElement("div");
        labels.className = "slider-labels";
        labels.innerHTML = "<span>" + (q.min_label || q.min) + "</span><span>" + (q.max_label || q.max) + "</span>";

        const input = document.createElement("input");
        input.type = "range";
        input.min = q.min;
        input.max = q.max;
        input.step = 1;
        input.value = val;
        input.addEventListener("input", () => {
          answers[q.id] = Number(input.value);
          valEl.textContent = input.value;
          updateNextButtonState();
        });

        wrap.appendChild(valEl);
        wrap.appendChild(labels);
        wrap.appendChild(input);
        questionCard.appendChild(wrap);
      } else {
        const isMulti = q.type === "multi_choice";
        if (!isMulti && answers[q.id] === undefined) answers[q.id] = null;
        if (isMulti && !Array.isArray(answers[q.id])) answers[q.id] = [];

        q.options.forEach((opt) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "opt" + (isMulti ? " multi" : "");
          btn.textContent = opt.text;
          const selected = isMulti
            ? answers[q.id].includes(opt.id)
            : answers[q.id] === opt.id;
          if (selected) btn.classList.add("selected");

          btn.addEventListener("click", () => {
            if (isMulti) {
              const list = answers[q.id];
              const idx = list.indexOf(opt.id);
              if (idx >= 0) list.splice(idx, 1);
              else {
                if (list.length >= (q.max_select || 99)) return;
                list.push(opt.id);
              }
              renderQuestion();
            } else {
              answers[q.id] = opt.id;
              renderQuestion();
            }
          });
          optionsWrap.appendChild(btn);
        });
        questionCard.appendChild(optionsWrap);
      }

      prevBtn.disabled = currentIndex === 0;
      const last = currentIndex === total - 1;
      nextBtn.textContent = last ? "查看结果" : "下一题";
      updateNextButtonState();
    }

    function matchConsultants(profileId) {
      const base = (config.sample_consultants || []).filter((c) =>
        (c.match_profiles || []).includes(profileId)
      );
      const q17 = config.questions.find((x) => x.id === "q17_preferred_consultant");
      const picked = q17 ? getSelectedOptions(q17) : [];
      const areas = new Set();
      const q16 = config.questions.find((x) => x.id === "q16_target_major_area");
      getSelectedOptions(q16).forEach((o) => {
        if (o.major_area) areas.add(o.major_area);
      });
      if (!areas.size && !picked.length) return base;

      const scored = base.map((c) => {
        let bonus = 0;
        (c.match_major_areas || []).forEach((a) => {
          if (areas.has(a)) bonus += 2;
        });
        if (picked.some((o) => o.consultant_type === "multi_perspective")) bonus += 1;
        return { c, bonus };
      });
      scored.sort((a, b) => b.bonus - a.bonus);
      return scored.map((s) => s.c);
    }

    function renderChoiceSummaryItems(items) {
      if (!items || !items.length) return "";
      let html = "<div class=\"section\"><h3>关键选择（可多选）</h3><ul>";
      items.forEach((item) => {
        html += "<li><strong>" + item.q + "</strong><span>" + item.a.join("；") + "</span></li>";
      });
      html += "</ul></div>";
      return html;
    }

    function collectChoiceSummaryItems() {
      const ids = [
        "q04_interest_scene",
        "q05_least_acceptable_content",
        "q09_learning_style",
        "q13_family_preference",
        "q14_current_anxiety",
        "q16_target_major_area",
        "q17_preferred_consultant"
      ];
      const items = [];
      ids.forEach((qid) => {
        const q = config.questions.find((x) => x.id === qid);
        if (!q) return;
        const texts = getSelectedOptions(q).map((o) => o.text);
        if (!texts.length) return;
        items.push({ q: q.question, a: texts });
      });
      return items;
    }

    function renderChoiceSummary() {
      return renderChoiceSummaryItems(collectChoiceSummaryItems());
    }

    function buildResultPayload() {
      const scores = accumulateScores();
      const ranked = rankProfiles(scores);
      const primary = ranked[0];
      const secondary = ranked[1];
      const rule = primary.rule;
      const conf = confidenceLabel(primary, secondary);
      const consultants = matchConsultants(rule.id);
      const topDims = dimensionKeys()
        .map((k) => ({ k, v: scores[k] }))
        .sort((a, b) => b.v - a.v)
        .slice(0, 5);
      return {
        scores,
        ranked,
        primary,
        secondary,
        rule,
        conf,
        consultants,
        topDims,
        choices: collectChoiceSummaryItems()
      };
    }

    function fromBase64Url(str) {
      let base = str.replace(/-/g, "+").replace(/_/g, "/");
      while (base.length % 4) base += "=";
      return JSON.parse(decodeURIComponent(atob(base)));
    }

    function buildShareUrl(payload) {
      let url = location.pathname + "?r=" + encodeURIComponent(profileSlug(payload.primary.rule.id));
      if (payload.conf === "低" && payload.secondary) {
        url += "&s=" + encodeURIComponent(profileSlug(payload.secondary.rule.id));
      }
      return location.origin + url;
    }

    function serializeFullResultPayload(payload) {
      return {
        p: payload.primary.rule.id,
        s: payload.conf === "低" && payload.secondary ? payload.secondary.rule.id : "",
        c: payload.conf,
        d: payload.topDims.map((x) => [x.k, Math.round(x.v * 10) / 10]),
        ch: payload.choices
      };
    }

    function restoreFullResultPayload(data) {
      const rule = (config.profile_rules || []).find((r) => r.id === data.p);
      if (!rule) return null;
      const secondaryRule = data.s
        ? (config.profile_rules || []).find((r) => r.id === data.s)
        : null;
      return {
        rule,
        conf: data.c || "中",
        secondary: secondaryRule ? { rule: secondaryRule } : null,
        consultants: matchConsultants(rule.id),
        topDims: (data.d || []).map((item) => ({ k: item[0], v: item[1] })),
        choices: data.ch || [],
        primary: { rule }
      };
    }

    function saveFullResultSession(payload) {
      try {
        sessionStorage.setItem(FULL_RESULT_SESSION_KEY, JSON.stringify(serializeFullResultPayload(payload)));
      } catch (e) {
        console.warn(e);
      }
    }

    function restoreFullResultView() {
      let raw;
      try {
        raw = sessionStorage.getItem(FULL_RESULT_SESSION_KEY);
      } catch (e) {
        return false;
      }
      if (!raw) return false;
      let data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        return false;
      }
      const payload = restoreFullResultPayload(data);
      if (!payload) return false;

      document.body.classList.remove("share-view");
      document.body.classList.add("result-view");
      document.getElementById("shareBanner").classList.add("hidden");
      document.getElementById("shareBackBtn").classList.add("hidden");
      history.replaceState(null, "", location.pathname);
      document.title = payload.rule.display_name + " · AI专业测试";
      resultSection.innerHTML = renderResultSections(payload, { shareView: false });
      resultSection.classList.remove("hidden");
      bindResultActions(payload);
      resultSection.scrollIntoView({ behavior: "smooth", block: "start" });
      return true;
    }

    function maybeShowShareBackButton(params) {
      const btn = document.getElementById("shareBackBtn");
      if (!btn) return;
      if (params.get("ref") !== "self") {
        btn.classList.add("hidden");
        return;
      }
      try {
        if (!sessionStorage.getItem(FULL_RESULT_SESSION_KEY)) {
          btn.classList.add("hidden");
          return;
        }
      } catch (e) {
        btn.classList.add("hidden");
        return;
      }
      btn.classList.remove("hidden");
      btn.onclick = () => { restoreFullResultView(); };
    }

    function renderShareResultSections(payload) {
      const rule = payload.rule;
      const conf = payload.conf;
      const secondary = payload.secondary;
      const majors = (rule.recommended_majors || []).slice(0, 8);

      let html = "<div class=\"card result\">";
      html += "<div class=\"profile-name\">" + rule.display_name + "</div>";
      if (conf === "低" && secondary) {
        html += "<p class=\"result-subline\">辅助画像：" + secondary.rule.display_name + "</p>";
      }
      html += "<div class=\"keywords\">";
      (rule.keywords || []).slice(0, 4).forEach((kw) => { html += "<span class=\"kw\">" + kw + "</span>"; });
      html += "</div>";
      if (majors.length) {
        html += "<div class=\"major-pills\">";
        majors.forEach((m) => { html += "<span class=\"major-pill\">" + m + "</span>"; });
        html += "</div>";
      }
      html += "<div class=\"result-actions result-actions-share\">";
      html += "<div class=\"result-actions-row\">";
      html += "<a class=\"btn btn-primary\" href=\"https://ai.voce.chat\" target=\"_blank\" rel=\"noopener noreferrer\">AI 匹配学长学姐</a>";
      html += "<a class=\"btn btn-outline\" href=\"" + location.pathname + "\">我也要测试</a>";
      html += "</div>";
      html += "<button type=\"button\" class=\"btn btn-share btn-share-copy\" id=\"copyShareLinkBtn\">复制链接分享</button>";
      html += "<span id=\"shareLinkCopiedTip\" class=\"share-copied-tip\"></span>";
      html += "</div>";
      html += "</div>";
      return html;
    }

    function renderFullResultSections(payload) {
      const rule = payload.rule;
      const conf = payload.conf;
      const secondary = payload.secondary;
      const consultants = payload.consultants || [];
      const topDims = payload.topDims || [];
      const choices = payload.choices || [];

      let html = "<div class=\"card result\">";
      html += "<h2>你的专业选择画像</h2>";
      html += "<div class=\"profile-name\">" + rule.display_name + "</div>";
      if (conf === "低" && secondary) {
        html += "<p>辅助画像：<strong>" + secondary.rule.display_name + "</strong>（双画像接近，建议两个方向都了解）</p>";
      } else {
        html += "<p>匹配置信度：<strong>" + conf + "</strong></p>";
      }
      html += "<div class=\"keywords\">";
      (rule.keywords || []).forEach((kw) => { html += "<span class=\"kw\">" + kw + "</span>"; });
      html += "</div>";
      html += "<p>" + rule.description + "</p>";
      html += renderChoiceSummaryItems(choices);

      html += "<div class=\"section\"><h3>适合优先了解的专业方向</h3><ul>";
      (rule.recommended_majors || []).forEach((m) => { html += "<li>" + m + "</li>"; });
      html += "</ul></div>";

      if (rule.explore_majors && rule.explore_majors.length) {
        html += "<div class=\"section\"><h3>可进一步了解</h3><ul>";
        rule.explore_majors.forEach((m) => { html += "<li>" + m + "</li>"; });
        html += "</ul></div>";
      }

      if (rule.caution_majors && rule.caution_majors.length) {
        html += "<div class=\"section\"><h3 class=\"caution\">需谨慎评估</h3><ul class=\"caution\">";
        rule.caution_majors.forEach((m) => { html += "<li>" + m + "</li>"; });
        html += "</ul></div>";
      }

      html += "<div class=\"section\"><h3>维度得分概览</h3><ul>";
      topDims.forEach((d) => {
        const label = config.score_dimensions[d.k]?.label || d.k;
        html += "<li>" + label + "：" + Math.round(d.v * 10) / 10 + "</li>";
      });
      html += "</ul></div>";

      html += "<div class=\"section\"><h3>真实风险提示</h3><p>" + (rule.risk_note || "") + "</p></div>";

      html += "<div class=\"section\"><h3>建议和真正学过/做过的人聊一次</h3>";
      html += "<p>测试只能帮你缩小方向，专业真实的学习压力、就业路径和适配人群，只有经历过的人最清楚。</p>";
      html += "<div class=\"cta-guide\">";
      html += "<h4>下一步怎么做？</h4>";
      html += "<p>根据你的画像结果，我们的 AI 会自动帮你联系学长学姐进行一对一匹配，";
      html += "聊清楚该专业的课程、就业去向与是否适合你，先咨询后付费。</p>";
      html += "<p class=\"cta-price\">过去 <s>199元</s>，现在 30 分钟咨询仅需 <strong>99元</strong></p>";
      html += "<a class=\"btn-cta\" href=\"https://ai.voce.chat\" target=\"_blank\" rel=\"noopener noreferrer\">AI联系学长学姐进行一对一匹配</a>";
      html += "</div>";
      if (consultants.length) {
        consultants.forEach((c) => {
          html += "<div class=\"consultant-card\"><strong>" + c.name + " · " + c.school + " · " + c.major + "</strong>";
          html += "<span>" + c.status + " · " + (c.tags || []).join(" / ") + "</span>";
          html += "<span>可聊：" + (c.can_talk_about || []).join("、") + "</span></div>";
        });
      } else {
        html += "<p>匹配到对应的学长学姐后，AI 会通过短信或者微信发介绍给你！</p>";
      }
      html += "</div>";

      html += "<p class=\"disclaimer\">" + (config.test_meta.disclaimer || "") + "</p>";

      html += "<div class=\"result-actions result-actions-full\">";
      html += "<div class=\"result-actions-row\">";
      html += "<button type=\"button\" class=\"btn btn-share\" id=\"shareBtn\">分享测试结果</button>";
      html += "<button type=\"button\" class=\"btn btn-secondary\" id=\"restartBtn\">重新测试</button>";
      html += "</div>";
      html += "</div>";

      html += "</div>";
      return html;
    }

    function renderResultSections(payload, options) {
      const opts = options || {};
      if (opts.shareView) return renderShareResultSections(payload);
      return renderFullResultSections(payload);
    }

    function getPublicShareUrl() {
      const params = new URLSearchParams(location.search);
      params.delete("ref");
      const qs = params.toString();
      return location.origin + location.pathname + (qs ? "?" + qs : "");
    }

    async function copyTextToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (err) {
        const input = document.createElement("textarea");
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        document.body.removeChild(input);
      }
    }

    function showShareLinkCopiedTip() {
      const tip = document.getElementById("shareLinkCopiedTip");
      if (!tip) return;
      tip.textContent = "链接已复制";
      tip.classList.add("show");
      clearTimeout(showShareLinkCopiedTip._timer);
      showShareLinkCopiedTip._timer = setTimeout(() => tip.classList.remove("show"), 2500);
    }

    function bindSharePageActions() {
      const btn = document.getElementById("copyShareLinkBtn");
      if (!btn) return;
      btn.addEventListener("click", async () => {
        await copyTextToClipboard(getPublicShareUrl());
        showShareLinkCopiedTip();
      });
    }

    function bindResultActions(payload) {
      document.getElementById("restartBtn").addEventListener("click", restartTest);
      document.getElementById("shareBtn").addEventListener("click", () => {
        saveFullResultSession(payload);
        location.href = buildShareUrl(payload) + "&ref=self";
      });
    }

    function renderShareResultPage(data) {
      const rule = (config.profile_rules || []).find((r) => r.id === data.p);
      if (!rule) {
        resultSection.innerHTML = "<div class=\"card result\"><p>分享链接无效或已过期，请重新测试。</p></div>";
        return;
      }
      const secondaryRule = data.s
        ? (config.profile_rules || []).find((r) => r.id === data.s)
        : null;
      const payload = {
        rule,
        conf: data.c || "中",
        secondary: secondaryRule ? { rule: secondaryRule } : null,
        consultants: matchConsultants(rule.id),
        topDims: (data.d || []).map((item) => ({ k: item[0], v: item[1] })),
        choices: data.ch || []
      };
      document.title = rule.display_name + " · 分享结果";
      resultSection.innerHTML = renderResultSections(payload, { shareView: true });
      bindSharePageActions();
    }

    function renderResult() {
      const payload = buildResultPayload();
      document.body.classList.remove("quiz-view");
      document.body.classList.add("result-view");
      document.body.classList.remove("share-view");
      resultSection.innerHTML = renderResultSections(payload, { shareView: false });
      resultSection.classList.remove("hidden");
      bindResultActions(payload);
      resultSection.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function restartTest() {
      currentIndex = 0;
      config.questions.forEach((q) => initAnswerForQuestion(q));
      document.body.classList.remove("result-view");
      document.body.classList.add("quiz-view");
      try { sessionStorage.removeItem(FULL_RESULT_SESSION_KEY); } catch (e) { /* ignore */ }
      document.getElementById("shareBackBtn").classList.add("hidden");
      resultSection.classList.add("hidden");
      resultSection.innerHTML = "";
      quizSection.classList.remove("hidden");
      renderQuestion();
      quizSection.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function loadConfig() {
      try {
        const res = await fetch("./test-config.json");
        if (!res.ok) throw new Error("fetch failed");
        config = await res.json();
        if (!config.questions || !config.questions.length) throw new Error("empty");
        return true;
      } catch (e) {
        console.error(e);
        return false;
      }
    }

    startBtn.addEventListener("click", () => {
      if (!config) return;
      currentIndex = 0;
      config.questions.forEach((q) => initAnswerForQuestion(q));
      document.body.classList.add("quiz-view");
      resultSection.classList.add("hidden");
      quizSection.classList.remove("hidden");
      renderQuestion();
      quizSection.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex -= 1;
        renderQuestion();
      }
    });

    nextBtn.addEventListener("click", () => {
      const q = config.questions[currentIndex];
      if (q.required && !isAnswered(q)) return;
      if (currentIndex < config.questions.length - 1) {
        currentIndex += 1;
        renderQuestion();
      } else {
        quizSection.classList.add("hidden");
        renderResult();
      }
    });

    (async () => {
      const ok = await loadConfig();
      if (!ok) {
        heroSubtitle.textContent = "题库加载失败，请通过本地服务器访问（如 GitHub Pages）并确认 test-config.json 存在。";
        startBtn.textContent = "无法开始";
        return;
      }

      const params = new URLSearchParams(location.search);
      const shareData = parseShareData(params);
      if (shareData) {
        document.body.classList.add("share-view");
        document.getElementById("shareBanner").classList.remove("hidden");
        renderShareResultPage(shareData);
        maybeShowShareBackButton(params);
        resultSection.classList.remove("hidden");
        return;
      }

      renderHero();
      startBtn.disabled = false;
      startBtn.textContent = "开始测试";
    })();
  </script>
</body>
</html>
