<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZYBT AI专业测试 · 服务暂停</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #fff;
      --ink: #2f3a52;
      --muted: #72809a;
      --line: #e3e9f3;
      --primary: #2f8fef;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      min-height: 100vh;
    }
    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
    }
    .brand-lockup {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .brand-logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--ink);
    }
    .brand-powered {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .shell {
      max-width: 520px;
      margin: 0 auto;
      padding: 64px 20px 40px;
      text-align: center;
    }
    h1 {
      font-size: 1.55rem;
      margin-bottom: 12px;
    }
    p {
      color: var(--muted);
      font-size: 0.98rem;
      margin-bottom: 10px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px 22px;
      box-shadow: 0 8px 24px rgba(32, 46, 79, 0.08);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand-lockup">
      <img src="./assets/logo.jpg" alt="ZYBT AI专业测试" class="brand-logo" width="52" height="52">
      <div>
        <div class="brand-title">ZYBT AI专业测试</div>
        <div class="brand-powered">Zhuan Ye Before Tianzhiyuan</div>
      </div>
    </div>
  </header>
  <main class="shell">
    <div class="card">
      <h1>服务暂时关闭</h1>
      <p>专业测试服务已暂停，暂不接受新测试。</p>
      <p>恢复时间将另行通知，给您带来不便，敬请谅解。</p>
    </div>
  </main>
</body>
</html>
