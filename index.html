<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZYBT AI专业测试 · 专业选择画像测试</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #fff;
      --ink: #2f3a52;
      --muted: #72809a;
      --line: #e3e9f3;
      --primary: #2f8fef;
      --primary-soft: #eef5ff;
      --shadow: 0 8px 24px rgba(32, 46, 79, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      scrollbar-gutter: stable;
    }
    body {
      /* 仅系统字体栈：无 Web 字体文件，各平台默认可商用（UI 渲染用途） */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    body.result-view {
      --share-card-w: 343px;
    }
    .shell { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }

    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 12px rgba(32, 46, 79, 0.04);
      padding: 14px 16px;
      margin: 0 -16px 0;
    }
    .brand-lockup {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .brand-logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 14px rgba(47, 143, 239, 0.25);
      flex-shrink: 0;
      display: block;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      text-align: left;
      line-height: 1.2;
      min-height: 52px;
    }
    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
      background: linear-gradient(120deg, #2f8fef 0%, #1ab8c4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .brand-powered {
      margin-top: 4px;
      font-size: 0.78rem;
      color: #8b97ad;
      font-weight: 500;
      line-height: 1.2;
    }
    .brand-powered a {
      color: #5a7ab5;
      text-decoration: none;
      font-weight: 600;
    }
    .brand-powered a:hover { color: var(--primary); text-decoration: underline; }

    .hero {
      background: linear-gradient(180deg, #fff 0%, #f8fafe 100%);
      border-bottom: 1px solid var(--line);
      padding: 28px 16px 28px;
      text-align: center;
      margin: 0 -16px 24px;
    }
    .hero h1 { font-size: clamp(1.35rem, 3.5vw, 1.75rem); margin-bottom: 8px; color: #384058; font-weight: 700; }
    .hero .subtitle { color: var(--muted); max-width: 560px; margin: 0 auto 12px; font-size: 0.95rem; }
    .hero .meta { color: #9aa6bc; font-size: 0.85rem; margin-bottom: 16px; }
    .btn {
      border: 0; border-radius: 999px; padding: 11px 20px;
      font-weight: 700; font-size: 0.95rem; cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    .btn-primary {
      background: linear-gradient(120deg, #2f8fef 0%, #1ab8c4 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(47, 143, 239, 0.28);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(47, 143, 239, 0.35);
    }
    .btn-secondary {
      background: #fff;
      color: #5a6880;
      border: 2px solid #d8e2f0;
    }
    .btn-secondary:hover { background: #f8fafd; }
    .btn-outline {
      background: #fff;
      color: #1d6fd8;
      border: 2px solid #6eb5ff;
      box-shadow: 0 2px 8px rgba(47, 143, 239, 0.1);
    }
    .btn-outline:hover {
      background: linear-gradient(120deg, #f0f7ff 0%, #eefaf8 100%);
      transform: translateY(-1px);
    }
    .btn-share {
      background: linear-gradient(120deg, #e8f4ff 0%, #e6faf5 100%);
      color: #1d6fd8;
      border: 2px solid #6eb5ff;
      box-shadow: 0 2px 8px rgba(47, 143, 239, 0.15);
    }
    .btn-share:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(47, 143, 239, 0.2);
    }
    .share-copied-tip {
      flex-basis: 100%;
      text-align: center;
      font-size: 0.88rem;
      color: #2ea67d;
      font-weight: 700;
      min-height: 1.2em;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .share-copied-tip.show { opacity: 1; }
    .share-image-preview {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      padding: 16px;
      background: rgba(20, 28, 40, 0.72);
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .share-image-preview.show {
      display: flex;
    }
    .share-image-preview-panel {
      width: min(100%, 360px);
      max-height: 92vh;
      overflow: auto;
      background: #fff;
      border-radius: 14px;
      padding: 14px 14px 12px;
      box-shadow: 0 12px 40px rgba(20, 30, 50, 0.25);
    }
    .share-image-preview-hint {
      margin: 0 0 10px;
      text-align: center;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      color: #3d4a5c;
    }
    .share-image-preview-panel img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      -webkit-touch-callout: default;
      user-select: auto;
    }
    .share-image-preview-close {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f5f7fb;
      color: #4a5872;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .result-actions {
      display: flex;
      align-items: stretch;
      gap: 12px;
      margin-top: 24px;
    }
    .result-actions .btn {
      min-width: 0;
      padding: 13px 14px;
      font-size: 0.88rem;
      line-height: 1.25;
    }
    .result-actions-share {
      flex-direction: column;
      gap: 10px;
      margin-top: 0;
    }
    .result-actions-share .btn,
    .result-actions-share a.btn {
      width: 100%;
      flex: none;
    }
    .result-actions-full {
      flex-direction: column;
      gap: 10px;
    }
    .result-actions-row {
      display: flex;
      flex-direction: row;
      gap: 12px;
      width: 100%;
    }
    .result-actions-row .btn { flex: 1; }
    .major-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 4px;
    }
    .major-pill {
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 8px;
      background: #f0f4fa;
      color: #4a5872;
      font-weight: 600;
      white-space: nowrap;
    }
    .result-subline {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 6px;
    }
    .mbti-section { margin-top: 4px; }
    .share-block-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #8b97ad;
      margin: 14px 0 8px;
    }
    .mbti-share-card,
    .mbti-full-card {
      margin-top: 16px;
      padding: 14px 16px 16px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--line);
    }
    .mbti-section-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #8b97ad;
      margin: 0 0 10px;
      letter-spacing: 0.02em;
    }
    .mbti-full-card h3.mbti-section-title {
      font-size: 0.78rem;
      color: #8b97ad;
      margin-bottom: 10px;
    }
    .mbti-type-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-bottom: 8px;
    }
    .mbti-code {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.08em;
      line-height: 1.2;
    }
    .mbti-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #4a5872;
    }
    .mbti-share-desc,
    .mbti-body {
      font-size: 0.88rem;
      color: #5a6880;
      line-height: 1.5;
      margin: 0;
    }
    .mbti-careers {
      font-size: 0.88rem;
      color: #5a6880;
      margin: 10px 0 0;
      line-height: 1.5;
    }
    .mbti-careers strong {
      color: #4a5872;
      font-weight: 700;
    }
    .mbti-pills .major-pill {
      background: #f0f4fa;
      color: #4a5872;
      border: 1px solid #e3e9f3;
    }
    .major-pill-both {
      background: #eef5ff;
      color: #2d5a8e;
      border: 1px solid #b8d4f5;
      font-weight: 700;
    }
    .major-pill-q16 {
      box-shadow: 0 0 0 2px rgba(47, 143, 239, 0.2);
    }
    .combined-note {
      font-size: 0.82rem;
      color: #8b97ad;
      margin: 8px 0 0;
      line-height: 1.45;
    }
    .combined-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }
    .combined-list li {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 8px;
      font-size: 0.92rem;
      line-height: 1.4;
    }
    .combined-major-name {
      font-weight: 600;
      color: #4a5872;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .combined-tags {
      display: inline-flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 4px;
      flex-shrink: 0;
    }
    .combined-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      line-height: 1.3;
    }
    .combined-tag.profile { background: #eef2f8; color: #5a6880; }
    .combined-tag.mbti { background: #f3eef9; color: #6b4f8f; border: 1px solid #ddd0ec; }
    .combined-tag.explore { background: #f4f6f9; color: #8b97ad; }
    .combined-tag.focus { background: #eef5ff; color: #2f8fef; }
    .mbti-full-card {
      margin: 18px 0;
    }
    .share-back-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      color: #4a5872;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(32, 46, 79, 0.08);
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .share-back-btn:hover {
      background: #fff;
      color: var(--primary);
      border-color: #bcd4f5;
    }
    .share-page-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .full-result-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .full-result-stack > .card.result {
      align-self: stretch;
      width: 100%;
    }
    .full-result-share-top {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: var(--share-card-w, 343px);
      max-width: 100%;
      flex-shrink: 0;
      margin-left: auto;
      margin-right: auto;
      box-sizing: border-box;
    }
    body.result-view .full-result-share-top .share-actions-panel {
      width: 100%;
      max-width: none;
      margin: 0;
    }
    body.result-view .full-result-share-top .share-actions-panel .btn {
      font-size: 13px;
      padding: 12px 10px;
    }
    .full-result-main {
      position: relative;
      overflow: hidden;
    }
    .full-result-main.is-locked .full-analysis-body {
      user-select: none;
    }
    .full-analysis-guard {
      display: none;
    }
    .full-result-main.is-locked .full-analysis-guard {
      display: block;
      position: absolute;
      left: 0;
      right: 0;
      top: 14%;
      bottom: 0;
      z-index: 4;
      pointer-events: auto;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }
    .full-analysis-fade {
      position: absolute;
      left: 0;
      right: 0;
      top: -36px;
      bottom: 0;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.28s ease;
      -webkit-backdrop-filter: blur(24px) saturate(1.12);
      backdrop-filter: blur(24px) saturate(1.12);
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.22) 4%,
        rgba(255, 255, 255, 0.62) 10%,
        rgba(255, 255, 255, 0.9) 16%,
        rgba(255, 255, 255, 0.98) 22%,
        #fff 28%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 0, 0, 0.55) 6%,
        rgba(0, 0, 0, 0.92) 12%,
        #000 18%,
        #000 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 0, 0, 0.55) 6%,
        rgba(0, 0, 0, 0.92) 12%,
        #000 18%,
        #000 100%
      );
    }
    .full-result-main.is-unlocked .full-analysis-guard {
      display: none;
    }
    .full-result-main.is-unlocked .full-analysis-fade {
      opacity: 0;
    }
    .full-analysis-prompt {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 18px;
      z-index: 5;
      display: flex;
      justify-content: center;
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    .full-analysis-prompt.is-visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .full-analysis-prompt-panel {
      width: min(100%, 360px);
      padding: 18px 16px 16px;
      border-radius: 14px;
      border: 1px solid #d8e2f0;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 10px 32px rgba(32, 46, 79, 0.14);
      text-align: center;
    }
    .full-analysis-prompt-text {
      margin: 0 0 14px;
      font-size: 0.92rem;
      line-height: 1.65;
      color: #4a5872;
      font-weight: 600;
    }
    .full-analysis-prompt-panel .btn {
      width: 100%;
    }
    .share-page-stack > .card {
      margin-bottom: 0;
    }
    .share-actions-panel {
      margin-top: 0;
    }
    body.share-view {
      --share-card-w: 343px;
      background: #eef1f4;
    }
    .share-report-card.share-theme-blue {
      --share-accent: #3d6b9e;
      --share-accent-dark: #2f5a85;
      --share-accent-soft: #edf2f8;
      --share-accent-bar: #e6edf6;
      --share-accent-pill-border: #c5d0e4;
      --share-accent-border: rgba(61, 107, 158, 0.42);
      --share-accent-ink: #1a2d45;
      --share-accent-shadow: rgba(30, 45, 65, 0.18);
    }
    .share-report-card.share-theme-green {
      --share-accent: #4a7c59;
      --share-accent-dark: #3d6b52;
      --share-accent-soft: #edf5f0;
      --share-accent-bar: #e8f2ec;
      --share-accent-pill-border: #c5d9ce;
      --share-accent-border: rgba(77, 160, 110, 0.42);
      --share-accent-ink: #1a3d28;
      --share-accent-shadow: rgba(30, 50, 40, 0.18);
    }
    .share-report-card.share-theme-yellow {
      --share-accent: #8f7340;
      --share-accent-dark: #73602f;
      --share-accent-soft: #f8f4eb;
      --share-accent-bar: #f0ead8;
      --share-accent-pill-border: #ddd0b8;
      --share-accent-border: rgba(143, 115, 64, 0.42);
      --share-accent-ink: #3d3420;
      --share-accent-shadow: rgba(55, 45, 28, 0.16);
    }
    .share-report-card.share-theme-red {
      --share-accent: #9a5c5c;
      --share-accent-dark: #7d4848;
      --share-accent-soft: #f8efef;
      --share-accent-bar: #f0e4e4;
      --share-accent-pill-border: #dcc5c5;
      --share-accent-border: rgba(154, 92, 92, 0.42);
      --share-accent-ink: #3d2424;
      --share-accent-shadow: rgba(55, 32, 32, 0.16);
    }
    body.share-view .shell {
      max-width: calc(var(--share-card-w) + 32px);
      padding: 10px 16px 20px;
    }
    body.share-view .share-page-stack,
    body.result-view #resultSection > .share-page-stack {
      width: var(--share-card-w, 343px);
      max-width: 100%;
      margin-left: auto;
      margin-right: auto;
      gap: 12px;
      box-sizing: border-box;
    }
    .share-report-card {
      width: var(--share-card-w);
      max-width: 100%;
      margin: 0 auto;
      padding: 16px 16px 14px;
      border-radius: 16px;
      border: 1px solid #e8eaec;
      box-shadow: none;
      box-sizing: border-box;
      font-size: 16px;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }
    .share-report-header {
      text-align: center;
      margin-bottom: 12px;
    }
    .share-report-intro {
      font-size: 13px;
      line-height: 18px;
      color: #8b97ad;
      margin: 0 0 6px;
    }
    .share-report-title {
      font-size: 34px;
      line-height: 40px;
      font-weight: 800;
      color: #3d4a5c;
      margin: 0;
    }
    .share-report-code {
      margin: 6px 0 0;
      font-size: 42px;
      line-height: 1.05;
      font-weight: 800;
      color: var(--share-accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .share-report-hero {
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
    }
    .share-report-hero-media {
      position: relative;
      width: 200px;
      max-width: 72%;
      flex-shrink: 0;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #f2f4f7;
      box-shadow: 0 4px 14px rgba(45, 55, 70, 0.1);
    }
    .share-report-illust {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .share-report-danmaku {
      position: absolute;
      inset: 0;
      list-style: none;
      margin: 0;
      padding: 0;
      pointer-events: none;
    }
    .share-danmaku-item {
      position: absolute;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      max-width: 86px;
      height: 22px;
      padding: 0 9px;
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      color: var(--share-accent-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--share-accent-border);
      box-shadow: 0 2px 10px var(--share-accent-shadow);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }
    .share-danmaku-item::before {
      content: "✓";
      display: inline-block;
      flex-shrink: 0;
      margin-right: 4px;
      font-size: 10px;
      line-height: 1;
      font-weight: 800;
      color: var(--share-accent);
    }
    .share-danmaku-item:nth-child(1) {
      top: 26px;
      left: 5px;
      transform: rotate(-4deg);
      transform-origin: left center;
    }
    .share-danmaku-item:nth-child(2) {
      top: 10px;
      right: 5px;
      left: auto;
      transform: rotate(3deg);
      transform-origin: right center;
    }
    .share-danmaku-item:nth-child(3) {
      bottom: 10px;
      right: 5px;
      left: auto;
      top: auto;
      transform: rotate(-2deg);
      transform-origin: right bottom;
    }
    .share-report-tagline {
      text-align: center;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      color: #5a6880;
      margin: 0 0 10px;
    }
    .share-report-match-bar {
      text-align: center;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      color: var(--share-accent-dark);
      background: var(--share-accent-bar);
      padding: 8px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .share-report-match-secondary {

        return new Promise((resolve) => {
          const timer = setTimeout(resolve, limit);
          const done = () => {
            clearTimeout(timer);
            resolve();
          };
          img.addEventListener("load", done, { once: true });
          img.addEventListener("error", done, { once: true });
        });
      });
      return withTimeout(Promise.all(waits), limit + 500, "images wait timeout").catch(() => {});

      const url = src.startsWith("http") ? src : new URL(src, location.href).href;
      const size = targetSize || SHARE_HERO_EXPORT_SIZE;
      return new Promise((resolve, reject) => {
        const img = new Image();
        const timer = setTimeout(() => reject(new Error("hero timeout")), 5000);
        img.onload = () => {
          clearTimeout(timer);
          try {
            const canvas = document.createElement("canvas");
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");
            const scale = Math.max(size / img.naturalWidth, size / img.naturalHeight);
            const w = img.naturalWidth * scale;
            const h = img.naturalHeight * scale;
            const x = (size - w) / 2;
            const y = (size - h) / 2;
            ctx.fillStyle = "#f2f4f7";
            ctx.fillRect(0, 0, size, size);
            ctx.drawImage(img, x, y, w, h);
            resolve(canvas.toDataURL("image/png"));
          } catch (e) {
            reject(e);
          }
        };
        img.onerror = () => {
          clearTimeout(timer);
          reject(new Error("hero load failed"));
        };
        img.src = url;
      });
    }

    function getSystemTextScale() {

      for (let i = 0; i < data.length; i += 4) {
        const a = data[i + 3];

        const r = data[i];

    /**
     * 主画像匹配度：8 个画像公式得分做 softmax，将第一名占比映射到 58–100%。
     * 与 confidenceLabel 同源（top/second 分差），双画像接近时匹配度会明显降低。
     */
    function computeMatchPercent(primary, secondary, ranked) {
      const list = ranked && ranked.length
        ? ranked
        : [primary, secondary].filter(Boolean);
      if (!list.length || !primary) return 0;

      if (list.length === 1) {
        return 94;
      }

      const raw = list.map((x) => Number(x.score) || 0);
      const maxS = Math.max(...raw);
      const exp = raw.map((s) => Math.exp(s - maxS));
      const sum = exp.reduce((a, b) => a + b, 0);
      const share = sum > 0 ? exp[0] / sum : 1 / list.length;
      const n = list.length;
      const uniform = 1 / n;
      if (share <= uniform) return 58;
      const t = (share - uniform) / (1 - uniform);
      return Math.round(58 + t * 42);
    }

    function matchPercentFromConfOnly(conf, hasSecondary) {
      const gap = hasSecondary
        ? (conf === "高" ? 0.22 : conf === "中" ? 0.14 : 0.05)
        : 0.22;
      return computeMatchPercent(
        { score: 1 },
        hasSecondary ? { score: Math.max(0.01, 1 - gap) } : null,
        [{ score: 1 }, hasSecondary ? { score: 1 - gap } : null].filter(Boolean)
      );
    }

    function resolveMatchPercent(payload, mpFromUrl) {
      if (mpFromUrl != null && mpFromUrl !== "" && !Number.isNaN(Number(mpFromUrl))) {
        return Math.min(100, Math.max(0, Math.round(Number(mpFromUrl))));
      }
      if (payload.matchPercent != null && payload.matchPercent !== "") {
        return Math.round(Number(payload.matchPercent));
      }
      if (payload.ranked && payload.primary) {
        return computeMatchPercent(payload.primary, payload.secondary, payload.ranked);
      }
      if (payload.primary) {
        return matchPercentFromConfOnly(payload.conf, !!(payload.secondary && payload.secondary.rule));
      }
      return 0;
    }

    const SHARE_MAJOR_LAYOUT = {

    const SHARE_MAJOR_CLUSTERS = [
      { id: "medicine", patterns: ["医学", "药学", "护理", "口腔", "临床", "康复", "检验", "中医"] },
      { id: "law", patterns: ["法学"] },

      { id: "architecture", patterns: ["建筑", "土木", "城乡规划", "工程管理"] },
      { id: "bio_chem", patterns: ["生物", "化学", "材料", "环境", "食品", "生态"] },
      { id: "finance", patterns: ["金融", "经济", "工商", "会计", "审计", "财务", "税收", "财政", "保险", "投资", "贸易", "电子商务", "物流"] },
      { id: "it_stem", patterns: [
        "计算机", "软件", "人工智能", "数据科学", "大数据", "网络工程", "信息安全", "物联网",
        "电子信息", "电子科学", "通信工程", "通信", "微电子", "集成电路", "光电信息",
        "自动化", "电气工程", "电气", "机器人", "智能制造", "信息工程"
      ] }
    ];

    function shareMajorClusterId(name) {
      const n = normalizeMajorName(name);
      if (!n) return "unknown";
      for (let i = 0; i < SHARE_MAJOR_CLUSTERS.length; i += 1) {
        const cluster = SHARE_MAJOR_CLUSTERS[i];
        if (cluster.patterns.some((p) => n.includes(p))) return cluster.id;
      }
      return "other:" + n;
    }

    /** 简版：名称过近或同属一个简版聚类，只保留得分更高者 */
    function majorsTooSimilar(nameA, nameB) {
      const na = normalizeMajorName(nameA);
      const nb = normalizeMajorName(nameB);
      if (!na || !nb) return false;
      if (na === nb) return true;
      if (shareMajorClusterId(na) === shareMajorClusterId(nb)
        && !shareMajorClusterId(na).startsWith("other:")) {
        return true;
      }
      if (na.length >= 3 && nb.length >= 3 && (na.includes(nb) || nb.includes(na))) return true;
      const short = na.length <= nb.length ? na : nb;
      const long = na.length > nb.length ? na : nb;
      if (short.length >= 4 && long.startsWith(short.slice(0, 4))) return true;
      let common = 0;
      const lim = Math.min(na.length, nb.length);
      while (common < lim && na[common] === nb[common]) common += 1;
      if (common >= 5) return true;
      if (common >= 4 && common / lim >= 0.55) return true;
      return false;
    }

    function estimateSharePillWidth(name) {
      const L = SHARE_MAJOR_LAYOUT;
      return L.padX + normalizeMajorName(name).length * L.charWidth;
    }

    /** 简版推荐：高分优先 + 跨学科聚类去重 + 最多两行排版 */
    function buildShareDisplayMajors(combined) {
      const L = SHARE_MAJOR_LAYOUT;
      const sorted = [...(combined || [])].sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        if (Boolean(b.q16Match) !== Boolean(a.q16Match)) return (b.q16Match ? 1 : 0) - (a.q16Match ? 1 : 0);
        const tierRank = (x) => (x.tier === "both" ? 3 : x.tier === "profile" ? 2 : x.tier === "mbti" ? 1 : 0);
        return tierRank(b) - tierRank(a);
      });
      const rowWidths = Array(L.maxRows).fill(0);
      const rows = Array.from({ length: L.maxRows }, () => []);
      const picked = [];
      const usedClusters = new Set();

      function tryPlace(item) {
        const w = estimateSharePillWidth(item.name);
        const order = rowWidths[0] <= rowWidths[1] ? [0, 1] : [1, 0];
        for (let i = 0; i < L.maxRows; i += 1) {
          const r = order[i];
          const gap = rows[r].length ? L.gap : 0;
          if (rowWidths[r] + gap + w <= L.contentWidth) {
            rows[r].push(item);
            rowWidths[r] += gap + w;
            return true;
          }
        }
        return false;
      }

      for (let i = 0; i < sorted.length; i += 1) {
        const item = sorted[i];
        const clusterId = shareMajorClusterId(item.name);
        if (!clusterId.startsWith("other:") && usedClusters.has(clusterId)) continue;
        if (picked.some((p) => majorsTooSimilar(p.name, item.name))) continue;
        if (!tryPlace(item)) break;
        if (!clusterId.startsWith("other:")) usedClusters.add(clusterId);
        picked.push(item);
      }
      return rows;
    }

    function renderShareMajorPill(item) {
      let cls = "share-report-pill";
      if (item.q16Match || item.tier === "both") cls += " is-highlight";

    function renderShareReportMajors(combined) {

    function renderProfileStory(rule, compact) {

    function encodeAnswerIndex(idx) {
      const n = Math.max(0, Math.min(35, Number(idx) || 0));
      if (n < 10) return String(n);
      return String.fromCharCode(87 + n);
    }

    function decodeAnswerIndex(ch) {
      if (!ch) return 0;
      const code = ch.charCodeAt(0);
      if (code >= 48 && code <= 57) return code - 48;
      if (code >= 97 && code <= 122) return code - 87;
      return 0;
    }

    function expectedAnswerCodecLength() {
      let len = 1;
      (config.questions || []).forEach((q) => {
        if (q.type === "multi_choice") len += 2;
        else len += 1;
      });
      return len;
    }

    function serializeAnswersToParam() {
      let raw = ANSWER_CODEC_VERSION;
      (config.questions || []).forEach((q) => {
        const a = answers[q.id];
        if (q.type === "single_choice") {
          const idx = q.options.findIndex((o) => o.id === a);
          raw += encodeAnswerIndex(idx < 0 ? 0 : idx);
        } else if (q.type === "multi_choice") {
          const indices = (Array.isArray(a) ? a : [])
            .map((id) => q.options.findIndex((o) => o.id === id))
            .filter((i) => i >= 0)
            .sort((x, y) => x - y);
          raw += encodeAnswerIndex(indices[0] ?? 0);
          raw += encodeAnswerIndex(indices[1] ?? 0);
        } else if (q.type === "scale_0_7" || q.type === "slider") {
          const n = clampScaleAnswer(q, a);
          const min = typeof q.min === "number" ? q.min : 1;
          raw += String(n == null ? min : n);
        }
      });
      return raw;
    }

    function parseAnswersParam(raw) {
      if (!raw || typeof raw !== "string") return null;
      const v = raw.trim();
      if (!v.length || v[0] !== ANSWER_CODEC_VERSION) return null;
      if (v.length !== expectedAnswerCodecLength()) return null;
      let pos = 1;
      const out = {};
      for (const q of config.questions || []) {
        if (q.type === "single_choice") {
          const idx = decodeAnswerIndex(v[pos++]);
          const opt = q.options[idx] || q.options[0];
          if (opt) out[q.id] = opt.id;
        } else if (q.type === "multi_choice") {
          const i0 = decodeAnswerIndex(v[pos++]);
          const i1 = decodeAnswerIndex(v[pos++]);
          const ids = [];
          if (q.options[i0]) ids.push(q.options[i0].id);
          if (i1 !== i0 && q.options[i1]) ids.push(q.options[i1].id);
          out[q.id] = ids;
        } else if (q.type === "scale_0_7" || q.type === "slider") {
          const digit = v[pos++];
          let n = digit >= "1" && digit <= "9" ? Number(digit) : defaultSliderValue(q);
          if (digit === "0") n = q.min ?? 1;
          out[q.id] = clampScaleAnswer(q, n);
        }
      }
      return pos === v.length ? out : null;
    }

    function applyAnswersObject(next) {
      (config.questions || []).forEach((q) => {
        if (next[q.id] === undefined) initAnswerForQuestion(q);
        else answers[q.id] = next[q.id];
      });
    }

    function buildFullResultUrl() {

    function dimensionKeys() {
      return Object.keys(config.score_dimensions || {});
    }

    function emptyScores() {
      const s = {};
      dimensionKeys().forEach((k) => { s[k] = 0; });
      return s;
    }

    function evalFormula(formula, scores) {
      let expr = formula;
      dimensionKeys().forEach((k) => {
        expr = expr.replace(new RegExp("\\b" + k + "\\b", "g"), String(scores[k] ?? 0));
      });
      try {
        return Function('"use strict"; return (' + expr + ")")();
      } catch (e) {
        return 0;
      }
    }

    function applyOptionScores(target, optionScores, multiplier) {
      if (!optionScores) return;
      const m = multiplier == null ? 1 : multiplier;
      Object.entries(optionScores).forEach(([dim, val]) => {
        if (target[dim] !== undefined) target[dim] += (Number(val) || 0) * m;
      });
    }

    function getSelectedOptions(q) {
      const ans = answers[q.id];
      if (!q.options) return [];
      if (q.type === "multi_choice") {
        return (ans || []).map((oid) => q.options.find((o) => o.id === oid)).filter(Boolean);
      }
      if (q.type === "single_choice" && ans) {
        const opt = q.options.find((o) => o.id === ans);
        return opt ? [opt] : [];
      }
      return [];
    }

    function accumulateScores() {
      const scores = emptyScores();
      config.questions.forEach((q) => {
        const ans = answers[q.id];
        if (ans === undefined || ans === null) return;

        if (q.type === "single_choice") {
          const opt = q.options.find((o) => o.id === ans);
          if (opt) applyOptionScores(scores, opt.scores);
        } else if (q.type === "multi_choice") {
          const selected = getSelectedOptions(q);
          if (!selected.length) return;
          const bucket = emptyScores();
          selected.forEach((opt) => applyOptionScores(bucket, opt.scores));
          const factor = 1 / selected.length;
          dimensionKeys().forEach((dim) => {
            scores[dim] += bucket[dim] * factor;
          });
        } else if ((q.type === "slider" || q.type === "scale_0_7") && q.score_formula && !q.mbti_axis) {
          const v = Number(ans);
          Object.entries(q.score_formula).forEach(([dim, formula]) => {
            const f = String(formula).replace(/value/g, String(v));
            if (scores[dim] !== undefined) scores[dim] += evalFormula(f, scores);
          });
        }
      });
      return scores;
    }

    function rankProfiles(scores) {
      return (config.profile_rules || [])
        .map((rule) => ({
          rule,
          score: evalFormula(rule.match_formula, scores)
        }))
        .sort((a, b) => b.score - a.score);
    }

    function confidenceLabel(top, second) {
      if (!second || second.score <= 0) return "高";
      const gap = (top.score - second.score) / Math.max(top.score, 0.01);
      if (gap >= 0.2) return "高";
      if (gap >= 0.1) return "中";
      return "低";
    }

    function isAnswered(q) {
      const ans = answers[q.id];
      if (q.type === "multi_choice") return Array.isArray(ans) && ans.length > 0;
      if (q.type === "scale_0_7") {
        return typeof ans === "number" && !Number.isNaN(ans);
      }
      if (q.type === "slider") {
        return typeof ans === "number" && !Number.isNaN(ans);
      }
      return ans !== undefined && ans !== null && ans !== "";
    }

    function defaultSliderValue(q) {
      return Math.round((q.min + q.max) / 2);
    }

    function clampScaleAnswer(q, raw) {
      const min = typeof q.min === "number" ? q.min : 1;
      const max = typeof q.max === "number" ? q.max : 7;
      if (raw === null || raw === undefined || raw === "") {
        return q.type === "scale_0_7" ? null : defaultSliderValue(q);
      }
      let n = Math.round(Number(raw));
      if (Number.isNaN(n)) {
        return q.type === "scale_0_7" ? null : defaultSliderValue(q);
      }
      if (n < min) n = min;
      if (n > max) n = max;
      return n;
    }

    function initAnswerForQuestion(q) {
      if (q.type === "multi_choice") answers[q.id] = [];
      else if (q.type === "slider") answers[q.id] = defaultSliderValue(q);
      else if (q.type === "scale_0_7") answers[q.id] = null;
      else answers[q.id] = null;
    }

    function renderQuestion() {
      const q = config.questions[currentIndex];
      const total = config.questions.length;
      const pct = Math.round(((currentIndex + 1) / total) * 100);
      progressText.textContent = "第 " + (currentIndex + 1) + " / " + total + " 题";
      progressPct.textContent = pct + "%";

      questionCard.innerHTML = "";
      if (q.module) {
        const tag = document.createElement("div");
        tag.className = "module-tag";

        questionCard.appendChild(tag);
      }
      const title = document.createElement("div");
      title.className = "q-text";
      title.textContent = q.question;
      questionCard.appendChild(title);

      if (q.type === "multi_choice") {
        const hint = document.createElement("div");
        hint.className = "q-hint";
        const max = q.max_select || 99;
        hint.textContent = max < 99 ? "可多选，最多选择 " + max + " 项" : "可多选";
        questionCard.appendChild(hint);
      }

      const optionsWrap = document.createElement("div");
      optionsWrap.className = "options";

      if (q.type === "scale_0_7") {
        const wrap = document.createElement("div");
        wrap.className = "scale07-wrap";
        const labels = document.createElement("div");
        labels.className = "scale07-labels";
        labels.innerHTML = "<span class=\"low\">" + (q.min_label || String(q.min ?? 1)) + "</span><span class=\"high\">" + (q.max_label || String(q.max ?? 7)) + "</span>";
        const btns = document.createElement("div");
        btns.className = "scale07-btns";
        const minV = typeof q.min === "number" ? q.min : 1;
        const maxV = typeof q.max === "number" ? q.max : 7;
        const selected = typeof answers[q.id] === "number" && !Number.isNaN(answers[q.id])
          ? clampScaleAnswer(q, answers[q.id])
          : null;
        for (let v = minV; v <= maxV; v += 1) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "scale07-btn";
          btn.dataset.v = String(v);
          btn.textContent = String(v);
          if (selected === v) {
            btn.classList.add("selected");
            if (v <= 3) btn.classList.add("low-side");
            else if (v >= 5) btn.classList.add("high-side");
            else btn.classList.add("mid-side");
          }
          btn.addEventListener("click", () => {
            answers[q.id] = v;
            renderQuestion();
          });
          btns.appendChild(btn);
        }
        wrap.appendChild(labels);
        wrap.appendChild(btns);
        questionCard.appendChild(wrap);
      } else if (q.type === "slider") {
        const wrap = document.createElement("div");
        wrap.className = "slider-wrap";
        if (answers[q.id] == null || Number.isNaN(answers[q.id])) {
          answers[q.id] = defaultSliderValue(q);
        }
        const val = answers[q.id];

        const valEl = document.createElement("div");
        valEl.className = "slider-value";
        valEl.textContent = val;

        const labels = document.createElement("div");
        labels.className = "slider-labels";
        labels.innerHTML = "<span>" + (q.min_label || q.min) + "</span><span>" + (q.max_label || q.max) + "</span>";

        const input = document.createElement("input");
        input.type = "range";
        input.min = q.min;
        input.max = q.max;
        input.step = 1;
        input.value = val;
        input.addEventListener("input", () => {
          answers[q.id] = Number(input.value);
          valEl.textContent = input.value;
          updateNextButtonState();
        });

        wrap.appendChild(valEl);
        wrap.appendChild(labels);
        wrap.appendChild(input);
        questionCard.appendChild(wrap);
      } else {
        const isMulti = q.type === "multi_choice";
        if (!isMulti && answers[q.id] === undefined) answers[q.id] = null;
        if (isMulti && !Array.isArray(answers[q.id])) answers[q.id] = [];

        q.options.forEach((opt) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "opt" + (isMulti ? " multi" : "");
          btn.textContent = opt.text;
          const selected = isMulti
            ? answers[q.id].includes(opt.id)
            : answers[q.id] === opt.id;
          if (selected) btn.classList.add("selected");

          btn.addEventListener("click", () => {
            if (isMulti) {
              const list = answers[q.id];
              const idx = list.indexOf(opt.id);
              if (idx >= 0) list.splice(idx, 1);
              else {
                if (list.length >= (q.max_select || 99)) return;
                list.push(opt.id);
              }
              renderQuestion();
            } else {
              answers[q.id] = opt.id;
              renderQuestion();
            }
          });
          optionsWrap.appendChild(btn);
        });
        questionCard.appendChild(optionsWrap);
      }

      prevBtn.disabled = currentIndex === 0;
      const last = currentIndex === total - 1;
      nextBtn.textContent = last ? "查看结果" : "下一题";
      updateNextButtonState();
    }

    function matchConsultants(profileId) {
      const base = (config.sample_consultants || []).filter((c) =>
        (c.match_profiles || []).includes(profileId)
      );
      const q17 = config.questions.find((x) => x.id === "q17_preferred_consultant");
      const picked = q17 ? getSelectedOptions(q17) : [];
      const areas = new Set();
      const q16 = config.questions.find((x) => x.id === "q16_target_major_area");
      getSelectedOptions(q16).forEach((o) => {
        if (o.major_area) areas.add(o.major_area);
      });
      if (!areas.size && !picked.length) return base;

      const scored = base.map((c) => {
        let bonus = 0;
        (c.match_major_areas || []).forEach((a) => {
          if (areas.has(a)) bonus += 2;
        });
        if (picked.some((o) => o.consultant_type === "multi_perspective")) bonus += 1;
        return { c, bonus };
      });
      scored.sort((a, b) => b.bonus - a.bonus);
      return scored.map((s) => s.c);
    }

        code += answers[q.id] > 3.5 ? highMap[axis] : axisMap[axis];

    function buildCombinedMajors(payload) {
      const rule = payload.rule;
      const secondary = payload.secondary;
      const mbti = payload.mbti;
      const q16Areas = payload.q16Areas || getQ16SelectedAreas();
      const cautionSet = new Set((rule.caution_majors || []).map(normalizeMajorName));
      const map = {};

      function ensure(name) {
        const key = normalizeMajorName(name);
        if (!key) return null;
        if (!map[key]) {
          map[key] = {
            name: key,
            score: 0,
            inProfileRec: false,
            inProfileExp: false,
            inMbti: false,
            inSecondaryRec: false,
            q16Match: false
          };
        }
        return map[key];
      }

      function add(name, points, mark) {
        const item = ensure(name);
        if (!item) return;
        item.score += points;
        if (mark) item[mark] = true;
      }

      (rule.recommended_majors || []).forEach((m, i) => add(m, 100 - i * 3, "inProfileRec"));
      (rule.explore_majors || []).forEach((m, i) => add(m, 52 - i * 2, "inProfileExp"));

      if (payload.conf === "低" && secondary && secondary.rule) {
        (secondary.rule.recommended_majors || []).forEach((m, i) => add(m, 58 - i * 2, "inSecondaryRec"));
        (secondary.rule.explore_majors || []).forEach((m, i) => add(m, 34 - i * 2, null));
      }

      if (mbti && mbti.recommended_majors) {
        mbti.recommended_majors.forEach((m, i) => add(m, 72 - i * 3, "inMbti"));
      }

      Object.values(map).forEach((item) => {
        if (item.inProfileRec && item.inMbti) item.score += 48;
        else if ((item.inProfileRec || item.inProfileExp || item.inSecondaryRec) && item.inMbti) item.score += 22;
        if (q16Areas.some((area) => majorMatchesArea(item.name, area))) {
          item.score += 28;
          item.q16Match = true;
        }
        if (cautionSet.has(item.name)) item.score -= 90;
      });

      return Object.values(map)
        .filter((x) => x.score > 0)
        .sort((a, b) => {
          if (b.score !== a.score) return b.score - a.score;
          const rank = (x) => (x.inProfileRec && x.inMbti ? 3 : x.inProfileRec ? 2 : x.inMbti ? 1 : 0);
          return rank(b) - rank(a);
        })
        .map((x) => ({
          name: x.name,
          score: Math.round(x.score),
          tier: x.inProfileRec && x.inMbti ? "both" : x.inProfileRec ? "profile" : x.inMbti ? "mbti" : "explore",
          q16Match: x.q16Match
        }));
    }

      return enrichPayload({

    function fromBase64Url(str) {
      let base = str.replace(/-/g, "+").replace(/_/g, "/");
      while (base.length % 4) base += "=";
      return JSON.parse(decodeURIComponent(atob(base)));
    }

      let url = location.pathname + "?r=" + encodeURIComponent(profileSlug(payload.primary.rule.id));

      const mp = resolveMatchPercent(payload, null);
      if (mp > 0) url += "&mp=" + encodeURIComponent(String(mp));
      if (payload.mbti && payload.mbti.code) {
        url += "&m=" + encodeURIComponent(payload.mbti.code);
      }
      return location.origin + url;
    }

      img.addEventListener("error", reveal, { once: true });
      wrap.appendChild(img);
      img.src = exportResult.dataUrl;
      if (img.complete && img.naturalWidth) reveal();
      window.scrollTo(0, scrollY);
      bindSharePageActions(payload, exportResult.dataUrl);
      return true;

      if (!prompt) return;
      prompt.classList.remove("is-visible");
      if (animate) {
        prompt.setAttribute("aria-hidden", "true");
      }
    }

    function showFullAnalysisPrompt() {
      const main = document.getElementById("fullResultMain");
      const prompt = document.getElementById("fullAnalysisPrompt");
      if (!main || !prompt || !main.classList.contains("is-locked")) return;
      prompt.setAttribute("aria-hidden", "false");
      requestAnimationFrame(() => prompt.classList.add("is-visible"));
    }

    function markShareImageSaved() {
      try {
        sessionStorage.setItem(SHARE_IMAGE_SAVED_KEY, "1");
      } catch (e) { /* ignore */ }
    }

    function hasShareImageSaved() {
      try {
        return sessionStorage.getItem(SHARE_IMAGE_SAVED_KEY) === "1";
      } catch (e) {
        return false;
      }
    }

    function getShareImageSrc(cachedDataUrl) {
      const img = document.querySelector(".full-result-stack .share-result-photo, .share-page-stack .share-result-photo");
      return (img && img.src) || cachedDataUrl || null;
    }

    function unlockFullAnalysis() {
      try {
        sessionStorage.setItem(FULL_ANALYSIS_UNLOCK_KEY, "1");
      } catch (e) { /* ignore */ }
      const main = document.getElementById("fullResultMain");
      if (!main) return;
      hideFullAnalysisPrompt(true);
      main.classList.remove("is-locked");
      main.classList.add("is-unlocked");
      if (fullAnalysisGateObserver) {
        fullAnalysisGateObserver.disconnect();
        fullAnalysisGateObserver = null;
      }
    }

    async function confirmFullAnalysisUnlock(payload) {
      const confirmBtn = document.getElementById("confirmFullAnalysisBtn");
      const confirmLabel = confirmBtn ? confirmBtn.textContent : "";
      if (confirmBtn) {
        confirmBtn.disabled = true;
        confirmBtn.textContent = hasShareImageSaved() ? "正在打开…" : "正在保存图片…";
      }
      try {
        if (!hasShareImageSaved()) {
          const mode = await downloadShareResultImage(payload, getShareImageSrc(null));
          markShareImageSaved();
          if (mode === "preview") {
            showShareActionTip(isWeChatBrowser() ? "请长按图片保存，全版分析已解锁" : "请保存图片，全版分析已解锁");
          } else {
            showShareActionTip("图片已保存，全文已解锁");
          }
        }
        unlockFullAnalysis();
      } catch (e) {
        console.error(e);
        showShareActionTip(e && e.message ? e.message : "保存图片失败，请重试");
      } finally {
        if (confirmBtn) {
          confirmBtn.disabled = false;
          confirmBtn.textContent = confirmLabel;
        }
      }
    }

    function scrollToFullAnalysisGate() {
      const guard = document.getElementById("fullAnalysisGuard");
      if (guard) {
        guard.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      const main = document.getElementById("fullResultMain");
      if (main) main.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function requestFullAnalysisUnlock() {
      if (isFullAnalysisUnlocked()) {
        scrollToFullAnalysisGate();
        return;
      }
      scrollToFullAnalysisGate();
      window.setTimeout(showFullAnalysisPrompt, 320);
    }

    function initFullAnalysisGate(payload) {
      const main = document.getElementById("fullResultMain");
      const guard = document.getElementById("fullAnalysisGuard");
      let confirmBtn = document.getElementById("confirmFullAnalysisBtn");
      if (!main || !guard) return;

      if (fullAnalysisGateObserver) {
        fullAnalysisGateObserver.disconnect();
        fullAnalysisGateObserver = null;
      }

      if (isFullAnalysisUnlocked()) {
        main.classList.remove("is-locked");
        main.classList.add("is-unlocked");
        hideFullAnalysisPrompt(false);
        return;
      }

      main.classList.add("is-locked");
      main.classList.remove("is-unlocked");
      hideFullAnalysisPrompt(false);

      if (confirmBtn) {
        confirmBtn = replaceNodeForBind(confirmBtn);
        confirmBtn.addEventListener("click", () => {
          confirmFullAnalysisUnlock(payload).catch((err) => console.error(err));
        });
      }

      fullAnalysisGateObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting && main.classList.contains("is-locked")) {
            showFullAnalysisPrompt();
          }
        });
      }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
      fullAnalysisGateObserver.observe(guard);
    }

    function mountFullResultDom(payload, topHtml) {
      resultSection.innerHTML = renderFullResultPageHtml(payload, topHtml);
      bindResultActions(payload);
      initFullAnalysisGate(payload);
      const img = resultSection.querySelector(".share-result-photo");
      bindSharePageActions(payload, img && img.src ? img.src : null);
    }

    async function mountFullResultPage(payload, options) {
      const opts = options || {};
      document.body.classList.remove("quiz-view", "share-view");
      document.body.classList.add("result-view");
      document.getElementById("shareBackBtn").classList.add("hidden");
      quizSection.classList.add("hidden");
      resultSection.classList.remove("hidden");
      if (!opts.skipSave) {
        saveFullResultSession(payload);
        try {
          sessionStorage.removeItem(SHARE_IMAGE_SAVED_KEY);
          sessionStorage.removeItem(FULL_ANALYSIS_UNLOCK_KEY);
        } catch (e) { /* ignore */ }
      }
      document.title = payload.rule.display_name + " · ZYBT AI专业测试";
      resultSection.innerHTML = renderResultBootScreen();

      if (!opts.skipScroll) {
        resultSection.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      let topHtml = renderShareTopGeneratingHtml(payload);
      try {
        const exportResult = await withTimeout(
          generateShareCardImageUrl(payload),
          22000,
          "生成图片超时，请点重新生成"
        );
        topHtml = renderShareImageTopHtml(payload, exportResult.dataUrl, exportResult, false);
      } catch (e) {
        console.error(e);
        const errMsg = e && e.message ? e.message : "生成分享图失败";
        topHtml = "<div id=\"shareResultTop\" class=\"full-result-share-top\">"
          + "<p class=\"share-image-save-hint\">" + errMsg + "。</p>"
          + "<button type=\"button\" class=\"btn btn-primary\" id=\"retryShareTopBtn\">重新生成分享图</button>"
          + renderShareActionsPanelHtml() + "</div>";
      }

      mountFullResultDom(payload, topHtml);
      const retry = document.getElementById("retryShareTopBtn");
      if (retry) {
        retry.addEventListener("click", () => mountFullResultPage(payload, Object.assign({}, opts, { skipScroll: true })));
      }

      if (!opts.skipUrlUpdate) {
        history.replaceState(null, "", opts.url || buildFullResultUrl());
      }
    }

    async function generateShareCardImageUrl(payload) {
      const shareTheme = shareThemeForRule(payload.rule);
      let heroSrc = shareProfileImageSrc(payload.rule);
      try {
        heroSrc = await preloadShareHeroDataUrl(payload.rule);
      } catch (e) {
        console.warn("hero preload failed, use direct src", e);
      }
      let qrSrc = shareQrImageSrc(shareTheme);
      try {
        qrSrc = await withTimeout(preloadQrDataUrl(shareTheme), 6000, "qr timeout");
      } catch (e) {
        console.warn("qr preload failed, use remote src", e);
      }
      const host = getShareCaptureHost();
      host.style.width = SHARE_CARD_EXPORT_WIDTH + "px";
      setShareCapturing(true);
      host.classList.add("is-capturing");
      host.innerHTML = renderShareReportCardHtml(payload, { heroSrc, qrSrc, forCapture: true });
      const card = host.querySelector(".share-report-card");
      if (!card) throw new Error("no card");
      applyShareCardTextCompensation(card);
      try {
        await flushCardLayout(card);
        const canvas = await captureShareCardCanvas(card);
        return {
          dataUrl: canvas.toDataURL("image/png"),
          width: canvas.width,
          height: canvas.height
        };
      } finally {
        host.classList.remove("is-capturing");
        host.innerHTML = "";
        host.style.width = "";
        setShareCapturing(false);
      }
    }

    async function mountShareImageResultPage(payload, options) {
      const opts = options || {};
      document.body.classList.remove("quiz-view", "result-view");
      document.body.classList.add("share-view");
      quizSection.classList.add("hidden");
      resultSection.classList.remove("hidden");
      resultSection.innerHTML = renderResultBootScreen();
      document.title = profileCodename(payload.rule) + " · 分享结果";

      if (!opts.skipScroll) {
        resultSection.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      try {
        const exportResult = await withTimeout(
          generateShareCardImageUrl(payload),
          22000,
          "生成图片超时，请点重新生成"
        );
        resultSection.innerHTML = "<div class=\"share-page-stack share-image-view\">"
          + renderShareImageTopHtml(payload, exportResult.dataUrl, exportResult, false) + "</div>";
        bindSharePageActions(payload, exportResult.dataUrl);
        if (opts.updateUrl !== false) {
          let url = opts.shareUrl;
          if (!url) {
            url = buildShareUrl(payload);
            if (opts.refSelf) url += "&ref=self";
          }
          history.replaceState(null, "", url);
        }
        if (opts.refSelf) {
          maybeShowShareBackButton(new URLSearchParams(location.search));
        }
      } catch (e) {
        console.error(e);
        const errMsg = e && e.message ? e.message : "生成分享图失败";
        resultSection.innerHTML = "<div class=\"card result\"><p>" + errMsg + "。</p>"
          + "<p style=\"font-size:0.88rem;color:#8b97ad;margin:8px 0 12px;\">微信内若反复失败，可点「查看全版分析」后截屏，或换 Safari/Chrome 打开。</p>"
          + "<button type=\"button\" class=\"btn btn-primary\" id=\"retryShareImageBtn\">重新生成</button>"
          + "<button type=\"button\" class=\"btn btn-outline\" id=\"fallbackFullBtn\" style=\"margin-top:8px;width:100%;\">查看全版分析</button></div>";
        const fallbackFull = document.getElementById("fallbackFullBtn");
        if (fallbackFull) {
          fallbackFull.addEventListener("click", () => {
            mountFullResultPage(payload, { skipSave: true, skipUrlUpdate: false, skipScroll: false })
              .catch((err) => console.error(err));
          });
        }
        const retry = document.getElementById("retryShareImageBtn");
        if (retry) {
          retry.addEventListener("click", () => mountShareImageResultPage(payload, opts));
        }
      }
    }

    async function downloadShareResultImage(payload, cachedDataUrl) {
      const url = typeof cachedDataUrl === "string"
        ? cachedDataUrl
        : (cachedDataUrl && cachedDataUrl.dataUrl);
      if (url) {
        if (isWeChatBrowser()) {
          showShareImagePreview(url);
          return "preview";
        }
        const codename = payload && payload.rule && payload.rule.codename_en
          ? payload.rule.codename_en
          : "result";
        const filename = "AI专业测试-" + codename + ".png";
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        return "download";
      }
      const card = document.querySelector(".share-report-card");
      if (!card) {
        const exportResult = await generateShareCardImageUrl(payload);
        return downloadShareResultImage(payload, exportResult.dataUrl);
      }
      const canvas = await captureShareCardCanvas(card);
      const dataUrl = canvas.toDataURL("image/png");
      if (isWeChatBrowser()) {
        showShareImagePreview(dataUrl);
        return "preview";
      }
      const codename = payload && payload.rule && payload.rule.codename_en
        ? payload.rule.codename_en
        : "result";
      const filename = "AI专业测试-" + codename + ".png";
      const blob = await new Promise((resolve) => {
        if (canvas.toBlob) {
          canvas.toBlob(resolve, "image/png");
        } else {
          resolve(null);
        }
      });
      if (blob) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        return "download";
      }
      showShareImagePreview(dataUrl);
      return "preview";
    }

    async function openFullAnalysisFromShare() {
      const main = document.getElementById("fullResultMain");
      if (main) {
        if (main.classList.contains("is-unlocked") || isFullAnalysisUnlocked()) {
          main.scrollIntoView({ behavior: "smooth", block: "start" });
        } else {
          requestFullAnalysisUnlock();
        }
        return true;
      }
      if (await restoreFullResultView()) return true;
      const params = new URLSearchParams(location.search);
      const v = params.get("v");
      if (v && await tryRenderFullResultFromParam(v)) return true;
      try {
        const raw = sessionStorage.getItem(FULL_RESULT_SESSION_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          const payload = restoreFullResultPayload(data);
          if (payload) {
            await mountFullResultPage(payload, {
              skipSave: true,
              url: data.v ? location.pathname + "?v=" + encodeURIComponent(data.v) : buildFullResultUrl()
            });
            return true;
          }
          if (data.v) {
            location.href = location.pathname + "?v=" + encodeURIComponent(data.v);
            return true;
          }
        }
      } catch (e) {
        console.warn(e);
      }
      showShareActionTip("暂无完整版数据，请先完成测试");
      return false;
    }

    function replaceNodeForBind(el) {
      if (!el || !el.parentNode) return el;
      const fresh = el.cloneNode(true);
      el.parentNode.replaceChild(fresh, el);
      return fresh;
    }

    function bindSharePageActions(payload, cachedDataUrl) {
      let downloadBtn = document.getElementById("downloadShareImageBtn");
      if (downloadBtn) {
        downloadBtn = replaceNodeForBind(downloadBtn);
        downloadBtn.addEventListener("click", async () => {
          const label = downloadBtn.textContent;
          const imgSrc = getShareImageSrc(cachedDataUrl);
          downloadBtn.disabled = true;
          downloadBtn.textContent = imgSrc ? "打开保存…" : "生成图片中…";
          try {
            const mode = await downloadShareResultImage(payload, imgSrc || cachedDataUrl);
            markShareImageSaved();
            if (mode === "preview") {
              showShareActionTip(isWeChatBrowser() ? "请长按图片保存" : "请长按或右键保存图片");
            } else {
              showShareActionTip("图片已保存");
            }
          } catch (e) {
            console.error(e);
            showShareActionTip(e && e.message ? e.message : "图片生成失败，请重试");
          } finally {
            downloadBtn.disabled = false;
            downloadBtn.textContent = label;
          }
        });
      }
      let fullBtn = document.getElementById("viewFullAnalysisBtn");
      if (fullBtn) {
        fullBtn = replaceNodeForBind(fullBtn);
        fullBtn.addEventListener("click", () => {
          openFullAnalysisFromShare().catch((err) => console.error(err));
        });
      }
    }

    function showFullLinkCopiedTip() {
      const tip = document.getElementById("fullLinkCopiedTip");
      if (!tip) return;
      tip.textContent = "完整报告链接已复制";
      tip.classList.add("show");
      clearTimeout(showFullLinkCopiedTip._timer);
      showFullLinkCopiedTip._timer = setTimeout(() => tip.classList.remove("show"), 2500);
    }

    function bindResultActions(payload) {
      document.getElementById("restartBtn").addEventListener("click", restartTest);
      document.getElementById("shareBtn").addEventListener("click", () => {
        const top = document.getElementById("shareResultTop");
        if (top) {
          top.scrollIntoView({ behavior: "smooth", block: "start" });
          return;
        }
        saveFullResultSession(payload);
        mountShareImageResultPage(payload, { refSelf: true });
      });
      const copyFullBtn = document.getElementById("copyFullLinkBtn");
      if (copyFullBtn) {
        copyFullBtn.addEventListener("click", async () => {
          await copyTextToClipboard(buildFullResultUrl());
          showFullLinkCopiedTip();
        });
      }
    }

    function renderFullResultPage(options) {
      const opts = options || {};
      mountFullResultPage(buildResultPayload(), {
        skipUrlUpdate: !!opts.skipUrlUpdate,
        skipScroll: !!opts.skipScroll,
        url: buildFullResultUrl()
      }).catch((e) => console.error(e));
    }

    async function tryRenderFullResultFromParam(vRaw) {
      const parsed = parseAnswersParam(vRaw);
      if (!parsed) return false;
      applyAnswersObject(parsed);
      await mountFullResultPage(buildResultPayload(), { skipUrlUpdate: true, skipScroll: false });
      return true;
    }

    function buildSharePayloadFromData(data, params) {
      const rule = (config.profile_rules || []).find((r) => r.id === data.p);
      if (!rule) return null;
      const secondaryRule = data.s
        ? (config.profile_rules || []).find((r) => r.id === data.s)
        : null;
      const payload = {
        rule,
        conf: data.c || "中",
        secondary: secondaryRule ? { rule: secondaryRule } : null,
        fromPrimaryId: resolveProfileId((params && params.get("from")) || ""),
        consultants: matchConsultants(rule.id),
        topDims: (data.d || []).map((item) => ({ k: item[0], v: item[1] })),
        choices: data.ch || [],
        primary: { rule },
        mbti: lookupMbti(data.m),
        matchPercent: resolveMatchPercent(
          { conf: data.c || "中", secondary: secondaryRule ? { rule: secondaryRule } : null, primary: { rule } },
          data.mp
        )
      };
      return enrichPayload(payload);
    }

    async function renderShareResultPage(data, urlParams) {
      const params = urlParams || new URLSearchParams(location.search);
      const vParam = params.get("v");
      if (vParam) {
        const parsed = parseAnswersParam(vParam);
        if (parsed) {
          applyAnswersObject(parsed);
          const full = buildResultPayload();
          saveFullResultSession(full);
          await mountFullResultPage(full, {
            skipUrlUpdate: false,
            url: location.pathname + "?v=" + encodeURIComponent(vParam)
              + (params.get("ref") === "self" ? "&ref=self" : "")
          });
          return;
        }
      }

      const sharePayload = buildSharePayloadFromData(data, params);
      if (!sharePayload) {
        resultSection.innerHTML = "<div class=\"card result\"><p>分享链接无效或已过期，请重新测试。</p></div>";
        return;
      }
      await mountShareImageResultPage(sharePayload, {
        refSelf: params.get("ref") === "self",
        updateUrl: false
      });
    }

    async function renderResult() {
      const payload = buildResultPayload();
      await mountFullResultPage(payload, {
        url: buildFullResultUrl()
      });
    }

    function restartTest() {
      currentIndex = 0;
      config.questions.forEach((q) => initAnswerForQuestion(q));
      document.body.classList.remove("result-view");
      document.body.classList.add("quiz-view");
      try {
        sessionStorage.removeItem(FULL_RESULT_SESSION_KEY);
        sessionStorage.removeItem(FULL_ANALYSIS_UNLOCK_KEY);
        sessionStorage.removeItem(SHARE_IMAGE_SAVED_KEY);
      } catch (e) { /* ignore */ }
      document.getElementById("shareBackBtn").classList.add("hidden");
      resultSection.classList.add("hidden");
      resultSection.innerHTML = "";
      quizSection.classList.remove("hidden");
      renderQuestion();
      quizSection.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function loadConfig() {
      try {
        const res = await fetch("./test-config.json");
        if (!res.ok) throw new Error("fetch failed");
        config = await res.json();
        if (!config.questions || !config.questions.length) throw new Error("empty");
        loadHtml2Canvas().catch(() => {});
        return true;
      } catch (e) {
        console.error(e);
        return false;
      }
    }

    startBtn.addEventListener("click", () => {
      if (!config) return;
      currentIndex = 0;
      config.questions.forEach((q) => initAnswerForQuestion(q));
      document.body.classList.add("quiz-view");
      resultSection.classList.add("hidden");
      quizSection.classList.remove("hidden");
      renderQuestion();
      quizSection.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex -= 1;
        renderQuestion();
      }
    });

    nextBtn.addEventListener("click", () => {
      const q = config.questions[currentIndex];
      if (q.required && !isAnswered(q)) return;
      if (currentIndex < config.questions.length - 1) {
        currentIndex += 1;
        renderQuestion();
      } else {
        quizSection.classList.add("hidden");
        renderResult().catch((e) => console.error(e));
      }
    });

    (async () => {
      const ok = await loadConfig();
      if (!ok) {
        heroSubtitle.textContent = "题库加载失败，请通过本地服务器访问（如 GitHub Pages）并确认 test-config.json 存在。";
        startBtn.textContent = "无法开始";
        return;
      }

      const params = new URLSearchParams(location.search);
      const vParam = params.get("v");
      if (vParam) {
        if (await tryRenderFullResultFromParam(vParam)) return;
        document.body.classList.add("result-view");
        quizSection.classList.add("hidden");
        resultSection.classList.remove("hidden");
        resultSection.innerHTML = "<div class=\"card result\"><p>完整结果链接无效或题库已更新，请重新测试。</p><a class=\"btn btn-primary\" href=\"" + location.pathname + "\">重新测试</a></div>";
        return;
      }

      const shareData = parseShareData(params);
      if (shareData) {
        document.body.classList.add("share-view");
        quizSection.classList.add("hidden");
        resultSection.classList.remove("hidden");
        renderShareResultPage(shareData, params).then(() => {
          maybeShowShareBackButton(params);
        });
        return;
      }

      renderHero();
      startBtn.disabled = false;
      startBtn.textContent = "开始测试";
    })();
  </script>
</body>
</html>
